# ── WordPress pages: pass through to WP (don't 404 on Netlify) ───────────────

[[redirects]]
  from = "/doggybloggy/*"
  to = "https://wiggleyourtail.com/doggybloggy/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/faqs/*"
  to = "https://wiggleyourtail.com/faqs/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/home-shop/*"
  to = "https://wiggleyourtail.com/home-shop/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/pet-boarding/*"
  to = "https://wiggleyourtail.com/pet-boarding/:splat"
  status = 200
  force = false

# ── Security & performance headers ───────────────────────────────────────────

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"
