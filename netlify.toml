# Netlify configuration for Wiggle Your Tail Pet Care

[build]
  publish = "wyt-site"

# ── WiggleYourTail/ old WordPress path redirects ─────────────────────────────

[[redirects]]
  from = "/WiggleYourTail/how-it-works/"
  to = "/how-it-works/"
  status = 301

[[redirects]]
  from = "/WiggleYourTail/contact/"
  to = "/contact/"
  status = 301

[[redirects]]
  from = "/WiggleYourTail/pet-policy/"
  to = "/terms-and-conditions/"
  status = 301

[[redirects]]
  from = "/WiggleYourTail/services-rates/"
  to = "/services-rates/"
  status = 301

[[redirects]]
  from = "/WiggleYourTail/privacy-policy/"
  to = "/privacy-policy/"
  status = 301

[[redirects]]
  from = "/WiggleYourTail/become-a-walker/"
  to = "/contact/"
  status = 301

# ── /services/ → services-rates ──────────────────────────────────────────────

[[redirects]]
